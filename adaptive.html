<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capture the Tiles</title>
<link rel="stylesheet" href="style.css">
<script src="adaptiveAi.js" defer></script>
</head>
<body>
<div id="topHud">
  <div id="aiDepthLive"></div>
  <button id="restartBtn" onclick="location.href='index.html'">Restart</button>
</div>
<div id="scores">
  P1 Score: <span id="p1score">10</span> —
  P2 Score: <span id="p2score">10</span>
</div>
<div id="aiThinking">
  Thinking
  <span class="loader-dots">
    <span></span><span></span><span></span>
  </span>
</div>
<div id="board"></div>
<div id="turn-container">
  <div id="turn-display" class="player1-turn">Turn: Player 1</div>
</div>
<div id="overlay" onclick="restartGame()">
  <div id="overlayBox" onclick="event.stopPropagation()">
    <h2 id="gameover">Game Over</h2>
    <h3 id="winner"></h3>
  </div>
</div>
</body>
</html>
