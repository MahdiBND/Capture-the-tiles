<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture the Tiles</title>
  <link rel="stylesheet" href="style.css">
  <script src="staticAi.js" defer></script>
  <script src="render.js" defer></script>
  <script src="state.js" defer></script>
  <script src="move.js" defer></script>
  <script src="eval.js" defer></script>
  <script src="minimax.js" defer></script>
  <script src="gameover.js" defer></script>
</head>
<body>
  <div id="modeScreen">
    <div class="mode-btn" onclick="startGame(false, false)">Multiplayer</div>
    <div class="mode-btn" onclick="startGame(true, false)">Single Player (vs AI)</div>
    <div class="mode-btn" onclick="location.href='adaptive.html'">Adaptive AI</div>

    <div id="aiDepthContainer" style="text-align:center;">
      <label style="font-size:22px;">AI Depth:
        <select id="aiDepthSelect" style="font-size:22px; padding:6px 10px;">
          <option value="2">2 (Fast)</option>
          <option value="3" selected>3 (Normal)</option>
          <option value="4">4 (Strong)</option>
          <option value="5">5 (Very Strong)</option>
          <option value="6">6 (Hardcore)</option>
        </select>
      </label>
    </div>
  </div>
  <div id="topHud">
    <div id="aiDepthLive"></div>
    <button id="restartBtn" onclick="restartGame()">Restart</button>
  </div>
  <div id="scores" style="display:none">
    P1 Score: <span id="p1score">10</span> —
    P2 Score: <span id="p2score">10</span>
  </div>
  <div id="aiThinking">
    Thinking
    <span class="loader-dots">
      <span></span><span></span><span></span>
    </span>
  </div>
  <div id="board"></div>
  <div id="turn-container" style="display:none">
    <div id="turn-display" class="player1-turn">Turn: Player 1</div>
  </div>
  <div id="overlay" onclick="restartGame()">
    <div id="overlayBox" onclick="event.stopPropagation()">
      <h2 id="gameover">Game Over</h2>
      <h3 id="winner"></h3>
    </div>
  </div>
  </body>
  </html>
